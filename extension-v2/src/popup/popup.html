<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <div class="popup-header">
      <div class="logo-section">
        <span class="logo-icon">🛡️</span>
        <h1 class="logo-text">PrivacyShield <span class="logo-accent">AI</span></h1>
      </div>
      <div class="version-badge">v2.0</div>
    </div>

    <!-- Status Section -->
    <div class="status-section">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Inactive</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Task Input -->
    <div class="task-section" id="taskSection">
      <label class="task-label" for="taskInput">🎯 Agent Goal</label>
      <div class="task-input-wrapper">
        <input type="text" id="taskInput" class="task-input"
               placeholder="e.g., Pay my electricity bill...">
        <button class="task-submit" id="taskSubmit" title="Start task">▶</button>
      </div>
      <div class="active-task" id="activeTask" style="display:none;">
        <span class="active-task-label">Active:</span>
        <span class="active-task-text" id="activeTaskText"></span>
        <button class="task-clear" id="taskClear" title="Clear task">✕</button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="quick-stats" id="quickStats">
      <div class="stat-item">
        <span class="stat-icon">👁️</span>
        <span class="stat-value" id="statDetected">0</span>
        <span class="stat-label">Detected</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">🛡️</span>
        <span class="stat-value" id="statProtected">0</span>
        <span class="stat-label">Protected</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">⚡</span>
        <span class="stat-value" id="statLatency">--</span>
        <span class="stat-label">ms</span>
      </div>
    </div>

    <!-- Pipeline indicator -->
    <div class="pipeline-status" id="pipelineStatus" style="display:none;">
      <div class="pipeline-bar">
        <div class="pipeline-fill" id="pipelineFill"></div>
      </div>
      <span class="pipeline-label" id="pipelineLabel">Processing...</span>
    </div>

    <!-- Quick Navigation to Dashboard & Inspector -->
    <div class="dashboard-actions" style="display: flex; gap: 8px; margin-top: 2px;">
      <button id="openSidepanelBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none; border-radius: 8px; color: white; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
        <span>📊</span> Open Dashboard
      </button>
      <button id="openDebugBtn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #cbd5e1; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
        <span>🔍</span> Privacy Inspector
      </button>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span class="footer-badge">On-Device AI</span>
      <span class="footer-dot">•</span>
      <span class="footer-badge">Privacy-First</span>
      <span class="footer-dot">•</span>
      <span class="footer-badge">SIH 26171</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
