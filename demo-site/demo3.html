<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Employee Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto h-12 w-12 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                <svg class="h-6 w-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900">Onboarding Setup</h2>
            <p class="mt-2 text-sm text-green-600 font-medium bg-green-50 py-1 px-3 rounded-full inline-block">
                🔒 This portal is secured and encrypted.
            </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-6" action="#" method="POST">
            
            <!-- Step Indicators -->
            <div class="flex justify-center items-center space-x-2 mb-6">
                <div class="w-8 h-2 rounded-full bg-indigo-600"></div>
                <div class="w-8 h-2 rounded-full bg-indigo-200"></div>
                <div class="w-8 h-2 rounded-full bg-gray-200"></div>
            </div>

            <div class="space-y-4">
                
                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input id="fullName" name="fullName" type="text" autocomplete="name" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Personal Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                </div>

                <!-- Phone -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input id="phone" name="phone" type="tel" autocomplete="tel" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                </div>

                <div class="border-t border-gray-200 my-4 pt-4">
                    <h3 class="text-sm font-semibold text-gray-900 mb-4">Payment Setup</h3>
                    
                    <!-- Credit Card -->
                    <div>
                        <label for="cc-number" class="block text-sm font-medium text-gray-700">Credit Card Number</label>
                        <input id="cc-number" name="cc-number" type="text" autocomplete="cc-number" placeholder="0000 0000 0000 0000" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                    </div>
                    
                    <!-- CVV -->
                    <div class="mt-4 w-1/3">
                        <label for="cc-csc" class="block text-sm font-medium text-gray-700">CVV</label>
                        <input id="cc-csc" name="cc-csc" type="text" autocomplete="cc-csc" placeholder="123" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm mt-1">
                    </div>
                </div>

            </div>

            <div>
                <button type="button" id="saveBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Save and Continue
                </button>
            </div>
        </form>
    </div>

</body>
</html>
